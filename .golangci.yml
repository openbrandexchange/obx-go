# golangci-lint v2 configuration (CI runs `golangci-lint run ./...`).
version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - unconvert
    - gosec
  settings:
    errcheck:
      # Writes to a terminal, an HTTP response or an in-memory buffer, and
      # closing or removing files on the way out: nothing useful can be done
      # when these fail.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
        - io.Copy
        - os.Remove
        - (io.Closer).Close
        - (*os.File).Close
        - (io.ReadCloser).Close
        - (*archive/zip.ReadCloser).Close
        - (*archive/zip.Writer).Close
        - (net/http.ResponseWriter).Write
        - (io.Writer).Write
        - (*encoding/json.Encoder).Encode
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001", "-QF1002"]
    gosec:
      excludes:
        - G104 # unchecked errors: errcheck covers them
        - G301 # 0755 folders for an exported catalog are meant to be readable
        - G304 # obx reads the files the user names
        - G306 # exported catalog files are meant to be readable (0644)
        - G107 # URLs come from the user's own portal address
        - G115 # integer conversions are range-checked where they matter
        - G101 # message texts and error codes that mention keys are not credentials
        - G404 # math/rand only jitters retry waits
        - G118 # the shutdown goroutine outlives the request context on purpose
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [errcheck, gosec]
      - path: ^(mock|conformance|cmd/obx-interop)/
        linters: [gosec] # test tooling: talks to local test portals on purpose
      # The conformance suite cleans up after itself best effort: a failed
      # cleanup must not turn into a failed test, and every call that a test
      # depends on is checked with t.Check.
      - path: ^conformance/
        linters: [errcheck]
      # The mock decodes request bodies it has already validated against the
      # spec's JSON Schemas, and its own stored JSON.
      - path: ^mock/
        linters: [errcheck]
        text: json.Unmarshal
formatters:
  enable: [gofmt]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
